# pnpm 工作区配置。
#
# packages 字段是必需的：pnpm 11 起，pnpm-workspace.yaml 若存在但缺少 packages，
# 会直接报错 "packages field missing or empty" 并拒绝执行 install。
# 本项目是单包（非 monorepo），用 "." 表示当前目录即唯一包。
packages:
  - "."

# esbuild 需要执行安装脚本才能下载平台二进制，否则 vite build 失败。
# pnpm 11 的键名是 allowBuilds（旧的 onlyBuiltDependencies 已不再读取）。
allowBuilds:
  esbuild: true
