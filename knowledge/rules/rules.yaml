# rules.yaml
# 中直高校政府采购需求审查 —— 结构化审查规则包（rule pack）
# 共 58 条规则。legal_basis 仅引用本轮已核实到原文的条款；
# 无法确证条款号的一律只写到文件名级别。

- code: LEGAL_QUALIFICATION_REGION
  name: 特定区域业绩限制
  category: legality
  severity: blocker
  applies_to: [资格条件, 评分办法]
  legal_basis: 《政府采购法实施条例》第二十条第四项
  check_prompt: 检查资格条件和评分办法中是否出现以特定行政区域（如"本市""本省""本地"）或特定行业的业绩、奖项作为加分条件、中标条件或资格门槛。若存在，判断其与采购项目的具体特点和实际需要是否相适应、与合同履行是否相关，并说明理由。只要出现地域限定，即应认定为以不合理条件对供应商实行差别待遇。
  violation_example: 投标人须提供近三年在北京市高校的同类项目业绩不少于3份，每提供1份加1分。
  suggestion_template: 删除地域或行业限定表述，改为"近三年（或约定年限内）承接的同类项目业绩"，并明确同类业务的具体范围；确需考察业绩的，数量要求一般不超过2个同类业务合同，且不得作为加分条件叠加使用。

- code: LEGAL_QUALIFICATION_BRAND
  name: 限定品牌商标专利
  category: legality
  severity: blocker
  applies_to: [资格条件, 技术参数]
  legal_basis: 《政府采购法实施条例》第二十条第六项
  check_prompt: 检查资格条件和技术参数中是否限定或指定了特定的专利、商标、品牌或者供应商。注意识别以"相当于""参照""同档次"等措辞包装但实际唯一指向某一品牌的情形。若指定品牌，判断是否属于无法用技术指标描述的唯一合理方式，并说明理由。
  violation_example: 投标产品须为华为、浪潮或同等品牌，且须提供该品牌厂商针对本项目的授权书。
  suggestion_template: 以功能、性能、材质、接口、安全等技术指标描述采购需求，删除品牌、商标、型号表述；确需引用某一品牌说明技术水平的，应删除该引用或改为"满足以下技术指标"的客观描述。

- code: LEGAL_QUALIFICATION_OWNERSHIP
  name: 所有制形式限制
  category: legality
  severity: blocker
  applies_to: [资格条件]
  legal_basis: 《政府采购法实施条例》第二十条第七项
  check_prompt: 检查资格条件中是否非法限定了供应商的所有制形式、组织形式或者所在地，例如要求供应商必须为国有企业、事业单位、内资企业、本地注册企业，或排除个体工商户、合伙企业、分支机构参与。若存在此类限定，说明其与采购项目实际需要的关系并给出违规判定。
  violation_example: 投标人须为在中华人民共和国境内注册的独立法人且为国有独资或国有控股企业。
  suggestion_template: 删除所有制、组织形式和注册地限制，按《政府采购法》第二十二条第一款规定的基本条件设置资格要求，允许法人、其他组织和自然人依法参加。

- code: LEGAL_QUALIFICATION_SCALE
  name: 规模条件设门槛
  category: legality
  severity: blocker
  applies_to: [资格条件, 评分办法]
  legal_basis: 《政府采购货物和服务招标投标管理办法》（财政部令第87号）第十七条
  check_prompt: 检查资格要求和评审因素中是否将投标人的注册资本、资产总额、营业收入、从业人员、利润、纳税额等规模条件作为门槛或评分项。注意识别"注册资金不低于""上年度营业收入不低于""员工人数不少于"等表述。若存在，直接判定为对投标人实行差别待遇或者歧视待遇。
  violation_example: 投标人注册资本不低于人民币1000万元，且2024年度营业收入不低于5000万元。
  suggestion_template: 删除所有规模条件类资格要求和评分项，改为与履约能力直接相关的条件，如特定专业资格或技术资格、必需的设备设施、专业人才及其管理能力等。

- code: LEGAL_QUALIFICATION_AUTHORIZATION
  name: 厂家授权作门槛
  category: legality
  severity: blocker
  applies_to: [资格条件]
  legal_basis: 《政府采购货物和服务招标投标管理办法》（财政部令第87号）第十七条
  check_prompt: 检查资格条件中是否将除进口货物以外的生产厂家授权、承诺、证明、背书等作为资格要求。若采购标的为国产货物却要求提供厂家授权或售后服务承诺函作为投标资格，即构成对投标人的差别待遇。说明该要求的必要性是否成立。
  violation_example: 投标人须提供所投产品生产厂家出具的本项目专项授权书原件，否则投标无效。
  suggestion_template: 删除将生产厂家授权、承诺、证明、背书作为资格条件的条款；如确需保障售后服务质量，可将其转化为合同履约条款或售后服务方案评审因素。

- code: LEGAL_QUALIFICATION_UNRELATED
  name: 资格条件与履约无关
  category: legality
  severity: high
  applies_to: [资格条件]
  legal_basis: 《政府采购法实施条例》第二十条第二项；《政府采购需求管理办法》第十八条
  check_prompt: 逐项检查资格条件，判断每一条是否与采购标的的功能、质量和供应商履约能力直接相关，是否属于履行合同必需的条件。对无法说明与合同履行关联性的条件（如要求提供与标的无关的体系认证、行业协会会员资格、办公场所面积等），判定为与项目实际需要不相适应。
  violation_example: 投标人须为中国教育装备行业协会会员单位，且在本地拥有不少于500平方米的办公场所。
  suggestion_template: 删除与采购标的和合同履行无直接关联的资格条件；保留的条件应逐条注明其与履约能力的关系，并按《政府采购需求管理办法》第十八条限定为专业资格或技术资格、设备设施、业绩情况、专业人才及其管理能力等类别。

- code: LEGAL_QUALIFICATION_POOL
  name: 违规设置供应商库
  category: legality
  severity: blocker
  applies_to: [资格条件]
  legal_basis: 《关于开展政府采购备选库、名录库、资格库专项清理的通知》（财办库〔2021〕14号）
  check_prompt: 检查资格条件中是否要求供应商先进入采购人自设的备选库、名录库、资格库、预选供应商库或入围名单方可参与投标。此类设置属于以备选库等方式排斥潜在供应商，应判定为违规。说明该库的设置主体和入库条件是否合法。
  violation_example: 本项目仅接受已入围我校"后勤服务供应商预选名录"的单位投标。
  suggestion_template: 取消以入库、入围名录作为参与前提的设置；供应商资格应按法定条件和项目实际需要，在每次采购活动中以公告方式公开征集并审查。

- code: LEGAL_QUALIFICATION_DIFFINFO
  name: 差别信息与标准
  category: legality
  severity: blocker
  applies_to: [资格条件, 评分办法]
  legal_basis: 《政府采购法实施条例》第二十条第一项、第五项
  check_prompt: 检查采购需求文件是否就同一采购项目向不同供应商提供了有差别的项目信息，或对供应商采取不同的资格审查、评审标准。重点核查是否存在针对特定供应商的补充说明、答疑口径差异或两套评审标准。若存在，判定为以不合理条件对供应商实行差别待遇。
  violation_example: 本地供应商可免于提交部分资格证明材料，外地供应商须提供全套原件核验。
  suggestion_template: 统一项目信息公开口径和资格审查、评审标准，对所有潜在供应商适用同一套条件；答疑与澄清内容应以书面形式同时通知所有获取采购文件的潜在供应商。

- code: LEGAL_QUALIFICATION_CREDIT
  name: 信用记录设置不当
  category: legality
  severity: medium
  applies_to: [资格条件]
  legal_basis: 《财政部关于在政府采购活动中查询及使用信用记录有关问题的通知》（财库〔2016〕125号）
  check_prompt: 检查资格条件中的信用要求是否明确查询渠道（"信用中国"网站、中国政府采购网）、截止时点、记录留存方式和使用规则。核查是否超出法定范围扩大失信惩戒对象，例如将一般行政处罚、非政府采购领域的轻微失信行为一律作为拒绝参与的依据。说明设置是否合法适当。
  violation_example: 投标人及其法定代表人近五年内有任何行政处罚记录的，不得参与本项目。
  suggestion_template: 按财库〔2016〕125号规定，明确信用信息查询渠道为"信用中国"网站和中国政府采购网，明确查询截止时点与留存方式，并将拒绝情形限定为列入失信被执行人、重大税收违法案件当事人名单、政府采购严重违法失信行为记录名单等法定情形。

- code: COMPLETE_SUBJECT_MATTER
  name: 采购标的缺失
  category: completeness
  severity: blocker
  applies_to: [需求正文]
  legal_basis: 《政府采购货物和服务招标投标管理办法》（财政部令第87号）第十一条
  check_prompt: 检查采购需求文件是否明确列明了采购标的的名称、类别和属性。若全文未出现可识别的采购标的，或标的名称为"一批设备""若干服务"等无法确定采购对象的模糊表述，判定为需求要素缺失。说明缺失的具体位置。
  violation_example: 采购标的：实验室相关设备一批（具体以现场为准）。
  suggestion_template: 按《政府采购品目分类目录》明确采购标的名称，细化到底级品目，并列明标的的功能或目标、数量、技术规格等要素，避免使用无法确定采购对象的概括表述。

- code: COMPLETE_QUANTITY
  name: 数量规格缺失
  category: completeness
  severity: high
  applies_to: [需求正文, 技术参数]
  legal_basis: 《政府采购货物和服务招标投标管理办法》（财政部令第87号）第十一条第四项
  check_prompt: 检查采购需求是否明确了采购标的的数量、采购项目交付或者实施的时间和地点。若数量缺失、以"按需""若干""视情况"等表述替代，或未给出交付时间和地点，判定为需求要素缺失。说明缺失项及对报价和履约的影响。
  violation_example: 采购数量：根据学校实际需求分批确定，具体数量以采购人通知为准。
  suggestion_template: 明确采购标的的数量或计量方式、交付（实施）的具体时间和地点；确因项目特点无法事先确定数量的，应说明定价方式和计量结算规则。

- code: COMPLETE_TECH_SPEC
  name: 技术规格缺失
  category: completeness
  severity: high
  applies_to: [技术参数]
  legal_basis: 《政府采购货物和服务招标投标管理办法》（财政部令第87号）第十一条第三项
  check_prompt: 检查采购需求是否明确了采购标的需满足的质量、安全、技术规格、物理特性等要求。若技术参数部分仅为品牌型号罗列、或仅有功能描述而无任何可验证的技术指标，判定为技术规格要素缺失。说明缺失导致无法组织评审和验收的后果。
  violation_example: 技术要求：设备性能优良、质量可靠，满足教学科研使用需求。
  suggestion_template: 按功能、性能、材料、结构、外观、安全等维度逐项列明客观技术指标，量化指标应明确相应等次；可直接引用国家标准、行业标准、地方标准等标准规范，或根据项目目标提出更高的技术要求。

- code: COMPLETE_COMMERCIAL
  name: 商务要求缺失
  category: completeness
  severity: high
  applies_to: [商务要求]
  legal_basis: 《政府采购需求管理办法》第六条、第八条
  check_prompt: 检查采购需求是否明确了取得采购标的的时间、地点、财务和服务要求，包括交付（实施）的时间（期限）和地点（范围）、付款条件（进度和方式）、包装和运输、售后服务、保险等。若商务要求整体缺失或仅有一两项，判定为需求要素缺失。逐项列出缺失内容。
  violation_example: 商务要求：详见合同。本项目商务条款由双方协商确定。
  suggestion_template: 按《政府采购需求管理办法》第六条列明全部商务要求：交付（实施）的时间期限和地点范围、付款条件（进度和方式）、包装和运输、售后服务、保险等，并明确每一项的客观、可验证标准。

- code: COMPLETE_ACCEPTANCE
  name: 履约验收缺失
  category: completeness
  severity: high
  applies_to: [商务要求, 需求正文]
  legal_basis: 《政府采购需求管理办法》第二十四条；《政府采购法实施条例》第四十五条
  check_prompt: 检查采购需求是否包含履约验收方案，且方案是否明确了履约验收的主体、时间、方式、程序、内容和验收标准。核查验收内容是否覆盖每一项技术和商务要求，验收标准是否包含所有客观、量化指标。若验收要求缺失或仅有"按国家标准验收"等空泛表述，判定为缺失。
  violation_example: 验收要求：项目完成后由采购人组织验收，验收合格后付款。
  suggestion_template: 明确履约验收的主体、时间、方式、程序、内容和验收标准；验收内容应包括每一项技术和商务要求的履约情况，验收标准应包括所有客观、量化指标；分期实施的项目应结合分期考核明确分期验收要求。

- code: COMPLETE_PAYMENT
  name: 付款方式缺失
  category: completeness
  severity: high
  applies_to: [商务要求]
  legal_basis: 《政府采购货物和服务招标投标管理办法》（财政部令第87号）第二十条第十项
  check_prompt: 检查采购需求是否明确了采购资金的支付方式、时间和条件，包括付款比例、付款节点和付款前提。若付款方式完全未提及，或仅写"按合同约定支付"而无具体安排，判定为商务要求缺失。说明对供应商报价和履约风险的影响。
  violation_example: 付款方式：项目验收合格后，按照学校财务规定办理付款手续。
  suggestion_template: 明确付款进度安排、各期付款比例、支付方式和付款前置条件；采购项目涉及后续采购或长期运行的，应在合同中约定成本补偿、风险分担等事项。

- code: COMPLETE_DELIVERY
  name: 交付时间地点缺失
  category: completeness
  severity: medium
  applies_to: [商务要求]
  legal_basis: 《政府采购货物和服务招标投标管理办法》（财政部令第87号）第十一条第四项
  check_prompt: 检查采购需求是否明确了采购标的交付或者实施的时间和地点。若只写"合同签订后尽快交付"或未指定交付地点，判定为要素缺失。说明该缺失将导致投标人无法准确测算成本。
  violation_example: 交货期：合同签订后按采购人要求的时间交货；交货地点：由采购人指定。
  suggestion_template: 明确交付（实施）的具体期限（如合同签订后X个日历日内）和具体交付地点（如XX校区XX楼XX室），并说明是否包含安装调试、运输和装卸费用。

- code: COMPLETE_AFTERSALES
  name: 售后服务缺失
  category: completeness
  severity: medium
  applies_to: [商务要求]
  legal_basis: 《政府采购货物和服务招标投标管理办法》（财政部令第87号）第十一条第五项
  check_prompt: 检查采购需求是否明确了采购标的需满足的服务标准、期限、效率等要求，特别是售后服务响应时间、服务方式、服务网点和备品备件供应安排。若售后服务要求缺失或仅有"提供优质售后服务"等不可验证表述，判定为缺失。
  violation_example: 售后服务：投标人应提供完善的售后服务，保证设备正常运行。
  suggestion_template: 量化售后服务要求：响应时间（如接到通知后X小时内响应、X小时内到达现场）、故障修复时限、质保期内服务方式、备品备件供应期限和价格约定、服务网点或本地化服务能力要求。

- code: COMPLETE_TRAINING
  name: 培训要求缺失
  category: completeness
  severity: low
  applies_to: [商务要求]
  legal_basis: 《政府采购需求管理办法》第六条、第八条
  check_prompt: 检查采购标的涉及设备操作、系统使用或专业交付时，采购需求是否明确了培训要求，包括培训对象、人数、内容、时长、方式和地点。若标的明显需要培训而需求文件未作任何安排，判定为要素缺失。说明该缺失对履约质量的影响。
  violation_example: 培训要求：中标人应为采购人提供必要的使用培训。
  suggestion_template: 明确培训的对象、人数、内容、时长、方式和地点，以及培训效果验证方式；将培训完成情况纳入履约验收内容和付款前置条件。

- code: COMPLETE_STANDARD
  name: 执行标准缺失
  category: completeness
  severity: medium
  applies_to: [技术参数]
  legal_basis: 《政府采购货物和服务招标投标管理办法》（财政部令第87号）第十一条第二项；《政府采购需求管理办法》第七条
  check_prompt: 检查采购需求是否明确了采购标的需执行的国家相关标准、行业标准、地方标准或者其他标准、规范。若涉及强制性标准的产品或服务未列明所执行的标准编号，判定为要素缺失并提示强制性标准适用风险。
  violation_example: 技术要求：产品应符合国家相关标准要求。
  suggestion_template: 列明采购标的需执行的标准编号和名称（如GB XXXX—XXXX），并说明是否需要根据项目目标提出高于该标准的技术要求。

- code: COMPLETE_QUALIFICATION_DOC
  name: 资格材料要求缺失
  category: completeness
  severity: medium
  applies_to: [资格条件]
  legal_basis: 《政府采购法实施条例》第十七条
  check_prompt: 检查采购需求是否明确了供应商应当提交的资格、资信证明文件及其内容与格式要求。若只列出资格条件而未说明需提交何种证明材料，或未说明采购项目有特殊要求时需提交的符合性证明材料，判定为要素缺失。
  violation_example: 资格要求：具有独立承担民事责任的能力（相关材料由投标人自行提供）。
  suggestion_template: 逐条对应资格条件列明需提交的证明材料，包括营业执照等证明文件、财务状况报告、依法缴纳税收和社会保障资金的相关材料、具备履行合同所必需设备和专业技术能力的证明材料、参加政府采购活动前3年内在经营活动中没有重大违法记录的书面声明等。

- code: TECH_BRAND_MODEL
  name: 指定品牌型号
  category: technical
  severity: blocker
  applies_to: [技术参数]
  legal_basis: 《政府采购法实施条例》第二十条第六项；《政府采购非招标采购方式管理办法》（财政部令第74号）第十条
  check_prompt: 检查技术参数中是否出现具体的品牌名称、商标或产品型号，包括以"参照""相当于""同档次"等措辞间接指定品牌的情形。若参数表以某一品牌型号的规格书为蓝本逐条罗列，也应按指定品牌处理。说明该参数是否能够以通用技术指标替代。
  violation_example: 技术参数：CPU不低于Intel Core i7-13700，主板须为华硕PRIME系列，整机参照戴尔OptiPlex 7010配置。
  suggestion_template: 删除品牌、商标、型号表述，改为以功能、性能、接口、材质、安全等技术指标描述需求；如需说明技术水平，可采用"满足下列全部技术指标"的客观描述方式，不得出现可唯一指向某产品的型号信息。

- code: TECH_UNIQUE_SUPPLIER
  name: 参数唯一指向
  category: technical
  severity: blocker
  applies_to: [技术参数]
  legal_basis: 《政府采购法实施条例》第二十条第三项；《政府采购需求管理办法》第三十一条
  check_prompt: 检查技术、服务要求是否指向特定供应商或特定产品。判断方法：将全部技术参数作为一个整体，评估市场上能够同时满足所有参数的供应商数量；若参数组合仅有一家供应商的产品能够满足，或参数中包含了某产品的独有技术特征，即构成指向特定供应商。说明指向性证据。
  violation_example: 技术参数：支持XX专利的智能温控算法，具备与我校现有XX品牌平台无缝对接的私有协议接口。
  suggestion_template: 逐条复核技术参数的必要性，删除非功能性、独有技术特征和排他性描述；对确需保证兼容性的要求，改为以公开的通用接口标准描述，并在需求调查基础上确认至少3家以上潜在供应商能够响应。

- code: TECH_OVER_SPECIFIC
  name: 参数过于具体排他
  category: technical
  severity: high
  applies_to: [技术参数]
  legal_basis: 《政府采购法实施条例》第二十条第二项、第八项
  check_prompt: 检查技术参数是否过于具体或排他，例如对非关键指标设定极窄的数值区间、要求与功能实现无关的外观尺寸或重量、设置无实际意义的冗余指标。判断该参数与采购项目的具体特点和实际需要是否相适应。对每一条可疑参数说明其是否影响功能实现。
  violation_example: 机箱尺寸须为（高×宽×深）290mm×92.6mm×292.8mm，整机重量不超过1.18kg。
  suggestion_template: 保留与功能实现直接相关的关键参数，删除或放宽非关键参数；对确需限定的指标采用合理区间或"不大于/不小于"表述，确保指标设置与采购项目的具体特点和实际需要相适应。

- code: TECH_STAR_CLAUSE
  name: 星号条款设置不当
  category: technical
  severity: high
  applies_to: [技术参数, 商务要求]
  legal_basis: 《政府采购货物和服务招标投标管理办法》（财政部令第87号）第二十条
  check_prompt: 检查需求文件中的"★""▲"等标注条款：一是核查是否以醒目的方式标明不允许偏离的实质性要求和条件；二是核查被标为实质性要求的条款是否确属关键指标，是否存在将大量非关键、非量化指标甚至品牌相关指标标为★导致实质性响应供应商不足3家的风险。统计★▲条款数量并评估其合理性。
  violation_example: 本项目中带★号的参数共47项，任意一项负偏离即视为无效投标。
  suggestion_template: 将实质性要求限定在影响功能实现、安全和合同履行的关键指标上，并在文件中以醒目方式标明；对非关键指标改为一般性评审因素；确保实质性要求不会导致满足条件的供应商不足3家。

- code: TECH_PATENT_TECH
  name: 特定专利技术路线
  category: technical
  severity: blocker
  applies_to: [技术参数]
  legal_basis: 《政府采购法实施条例》第二十条第六项；《政府采购需求管理办法》第三十一条
  check_prompt: 检查技术要求是否指向特定的专利、商标、品牌、技术路线。若参数描述中指定了专有技术名称、私有协议、特定算法架构或排他性技术路线，判定为指向特定产品。说明该技术路线是否为实现项目目标所必需且不可替代。
  violation_example: 系统须采用基于XX公司专利的分布式存储架构，并使用其专有的XX通信协议。
  suggestion_template: 以功能目标和性能指标描述技术需求，删除专有技术名称和私有协议限定；确需保证技术兼容的，应以公开标准或可验证的互操作性测试要求替代。

- code: TECH_SAMPLE
  name: 不合理要求样品
  category: technical
  severity: medium
  applies_to: [技术参数, 商务要求]
  legal_basis: 《政府采购货物和服务招标投标管理办法》（财政部令第87号）第二十二条
  check_prompt: 检查需求文件是否要求投标人提供样品。若要求提供样品，核查是否属于"仅凭书面方式不能准确描述采购需求"或"需要对样品进行主观判断以确认是否满足采购需求"的特殊情况，以及是否明确规定了样品制作标准和要求、检测报告要求、样品评审方法和评审标准。不符合条件的应判定为不合理要求。
  violation_example: 投标人须在投标截止前提交全部投标产品实物样品各一套，未提供者投标无效。
  suggestion_template: 取消一般性样品要求；确需提供样品的，应在文件中明确规定样品制作的标准和要求、是否需要随样品提交检测报告、样品的评审方法以及评审标准，并说明属于仅凭书面方式不能准确描述采购需求或需对样品进行主观判断的特殊情况。

- code: TECH_CORE_PRODUCT
  name: 核心产品未载明
  category: technical
  severity: medium
  applies_to: [技术参数]
  legal_basis: 《政府采购货物和服务招标投标管理办法》（财政部令第87号）第三十一条
  check_prompt: 检查非单一产品采购项目是否在文件中载明了核心产品。若采购包含多种产品而未根据项目技术构成、产品价格比重等合理确定并载明核心产品，判定为要素缺失。说明核心产品缺失对同品牌投标处理和竞争充分性的影响。
  violation_example: 本项目采购内容包括服务器、存储、交换机、机柜及配套线材，未载明核心产品。
  suggestion_template: 对非单一产品采购项目，根据技术构成和产品价格比重合理确定核心产品并在采购文件中载明；多家投标人提供的核心产品品牌相同的，按一家投标人计算。

- code: COMM_BID_BOND
  name: 投标保证金超额
  category: commercial
  severity: blocker
  applies_to: [商务要求]
  legal_basis: 《政府采购法实施条例》第三十三条；《政府采购非招标采购方式管理办法》（财政部令第74号）第十四条
  check_prompt: 检查投标（响应）保证金的数额是否超过采购项目预算金额的2%。计算保证金金额占预算金额的比例，若超过2%即判定违规。同时核查是否规定了退还时限（未中标供应商自中标通知书发出之日起5个工作日内、中标供应商自合同签订之日起5个工作日内）。
  violation_example: 投标保证金：人民币20万元（项目预算500万元）。
  suggestion_template: 将投标保证金数额调整至不超过采购项目预算金额的2%，并明确退还时限；采购人应当自中标通知书发出之日起5个工作日内退还未中标供应商的投标保证金，自政府采购合同签订之日起5个工作日内退还中标供应商的投标保证金。

- code: COMM_PERF_BOND
  name: 履约保证金超额
  category: commercial
  severity: blocker
  applies_to: [商务要求]
  legal_basis: 《政府采购法实施条例》第四十八条
  check_prompt: 检查履约保证金的数额是否超过政府采购合同金额的10%。计算履约保证金占合同金额的比例，若超过10%即判定违规。说明超标部分缺乏法律依据，将不合理增加供应商资金压力。
  violation_example: 中标人须在合同签订前提交合同金额20%的履约保证金。
  suggestion_template: 将履约保证金数额调整至不超过政府采购合同金额的10%，并明确履约保证金的退还条件和时限；不得以现金形式强制要求，应允许以支票、汇票、本票或者金融机构、担保机构出具的保函等非现金形式提交。

- code: COMM_BOND_FORM
  name: 保证金形式违法
  category: commercial
  severity: high
  applies_to: [商务要求]
  legal_basis: 《政府采购法实施条例》第三十三条、第四十八条；《关于进一步加大政府采购支持中小企业力度的通知》（财库〔2022〕19号）
  check_prompt: 检查需求文件中是否限定保证金必须以现金、电汇等特定形式提交，或是否收取了没有法律法规依据的保证金（如质量保证金、廉洁保证金、诚信保证金、农民工工资保证金等）。核查保证金形式是否限于支票、汇票、本票或者金融机构、担保机构出具的保函等非现金形式。
  violation_example: 投标保证金须以现金或电汇方式于投标截止前汇入我校指定账户，并额外缴纳中标金额3%的廉洁保证金。
  suggestion_template: 明确保证金可采用支票、汇票、本票或者金融机构、担保机构出具的保函等非现金形式提交；删除没有法律法规依据的保证金种类；鼓励对中小企业减免保证金或引入信用担保。

- code: COMM_PAYMENT_RATIO
  name: 付款比例不合理
  category: commercial
  severity: high
  applies_to: [商务要求]
  legal_basis: 《政府采购需求管理办法》第二十三条；《政府采购法实施条例》第五十一条
  check_prompt: 检查付款进度安排是否合理：是否存在要求供应商全额垫资、将绝大部分款项压至项目最终验收后支付、或付款比例与履约进度严重不匹配的情形。评估付款安排是否与合同履行阶段、分期考核要求相对应。说明对供应商资金成本和报价的影响。
  violation_example: 付款方式：项目全部完成并验收合格后一次性支付合同价款的100%，不设预付款。
  suggestion_template: 按项目特点划分合同履行阶段，明确各阶段付款比例和对应的考核要求，做到付款进度与履约进度相匹配；对中小企业应按财库〔2022〕19号要求提高预付款比例，并严格按规定及时支付采购资金。

- code: COMM_PAYMENT_DELAY
  name: 付款期限过长
  category: commercial
  severity: medium
  applies_to: [商务要求]
  legal_basis: 《政府采购法实施条例》第五十一条；《关于进一步加大政府采购支持中小企业力度的通知》（财库〔2022〕19号）
  check_prompt: 检查需求文件或合同条款中约定的付款期限是否过长（如验收合格后180日、一年后付款），是否以审计结论、上级拨款到位等不确定事件作为付款前提。说明此类条款将不当延长付款周期、加重中小企业资金压力。
  violation_example: 项目验收合格并经审计部门审计完成后，于次年度预算下达后支付合同款项。
  suggestion_template: 按合同约定及时支付采购资金，明确自验收合格之日起的具体付款天数；不得以审计、上级拨款等不确定事项作为付款前置条件，不得强制以商业汇票等非现金支付方式替代现金支付。

- code: COMM_WARRANTY_PERIOD
  name: 质保期设置过长
  category: commercial
  severity: medium
  applies_to: [商务要求]
  legal_basis: 《政府采购需求管理办法》第二十三条
  check_prompt: 检查质量保修范围和保修期要求是否超出行业通行水平和项目实际需要，例如对通用设备要求5年以上免费质保、要求终身免费保修或免费更换全部耗材。判断该要求与采购标的特点是否相适应，是否明显增加供应商成本并可能影响竞争。
  violation_example: 投标人须承诺对所投全部设备提供不少于8年免费质保及终身免费上门维护，质保期内免费更换一切零部件（含耗材）。
  suggestion_template: 根据采购标的的性质和行业通行标准合理设定质保期，明确质量保修范围、保修期起算时点和保修响应要求；将超出常规的质保要求与价格评审因素合理关联，或作为可选承诺项而非强制门槛。

- code: COMM_LIABILITY
  name: 违约责任不对等
  category: commercial
  severity: medium
  applies_to: [商务要求]
  legal_basis: 《政府采购需求管理办法》第二十三条
  check_prompt: 检查合同条款中采购人与供应商的违约责任是否对等。重点核查是否对供应商设置了畸高的违约金比例（如每日1%且无上限）、单方解除权、无限赔偿责任，而对采购人自身的付款违约、变更解除等责任未作约定或明显畸轻。说明权利义务设置是否围绕采购需求和合同履行公平设置。
  violation_example: 供应商逾期交付的，每逾期一日按合同总额的5%支付违约金，上不封顶；采购人逾期付款的，不承担违约责任。
  suggestion_template: 按民法典关于违约责任的规定对等设置双方权利义务，违约金比例与可能造成的损失相当并设置合理上限；同时明确采购人逾期付款的违约责任，使合同权利义务围绕采购需求和合同履行公平设置。

- code: COMM_MIN_PRICE
  name: 设定最低限价
  category: commercial
  severity: blocker
  applies_to: [需求正文, 商务要求]
  legal_basis: 《政府采购货物和服务招标投标管理办法》（财政部令第87号）第十二条
  check_prompt: 检查采购需求中是否设定了最低限价，包括"投标报价不得低于XX万元""低于成本价的报价视为无效""报价低于预算80%的作废标处理"等表述。采购人可以在采购预算额度内合理设定最高限价，但不得设定最低限价。若存在即判定违规。
  violation_example: 投标报价低于项目预算金额85%的，视为恶意低价，作无效投标处理。
  suggestion_template: 删除最低限价或最低报价限制条款；如需防范异常低价，应按《政府采购货物和服务招标投标管理办法》第六十条规定，由评标委员会要求投标人在评标现场提供书面说明和证明材料，不能证明报价合理性的作无效投标处理。

- code: COMM_JOINT_VENTURE
  name: 无理由拒绝联合体
  category: commercial
  severity: high
  applies_to: [资格条件, 商务要求]
  legal_basis: 《政府采购货物和服务招标投标管理办法》（财政部令第87号）第十九条
  check_prompt: 检查采购文件是否载明了是否接受联合体投标。若未载明，则不得拒绝联合体投标；若明确拒绝联合体投标，核查其是否基于采购项目的实施要求并有合理理由。说明联合体限制对竞争充分性和中小企业参与的影响。
  violation_example: 本项目不接受联合体投标（文件中未说明任何理由）。
  suggestion_template: 根据采购项目的实施要求明确载明是否接受联合体投标；决定不接受联合体的，应说明合理理由；鼓励接受大中型企业与小微企业组成联合体参与，以落实支持中小企业政策。

- code: SCORE_QUANTIFY
  name: 评分标准未量化
  category: scoring
  severity: high
  applies_to: [评分办法]
  legal_basis: 《政府采购法实施条例》第三十四条；《政府采购货物和服务招标投标管理办法》（财政部令第87号）第五十五条
  check_prompt: 检查评审因素是否细化和量化，评分标准中的分值设置是否与评审因素的量化指标相对应。逐项核查每个评分项是否有明确的评分档次、分值和判断依据；对"优、良、中、差"等档次评分，核查是否给出了各档次对应的客观判断标准。未量化或档次标准模糊的应判定为违规。
  violation_example: 技术方案（20分）：根据投标人技术方案的先进性、合理性综合打分，优得16—20分，良得11—15分，中得6—10分，差得0—5分。
  suggestion_template: 将评审因素细化为可量化的客观指标，并按量化指标的等次设置对应的不同分值；商务条件和采购需求指标有区间规定的，评审因素应量化到相应区间并设置各区间对应的不同分值；无法量化的指标应作为实质性要求而非评分项。

- code: SCORE_SUBJECTIVE_RATIO
  name: 主观分占比过高
  category: scoring
  severity: high
  applies_to: [评分办法]
  legal_basis: 《政府采购需求管理办法》第二十一条；《政府采购货物和服务招标投标管理办法》（财政部令第87号）第五十五条
  check_prompt: 统计评分办法中主观评分项（无客观判断标准、依赖评委自由裁量的评分项）的分值合计及占比。若主观分占比过高（一般超过30%）或核心评分项均为主观判断，判定为评审因素设置不当。说明哪些评分项缺乏客观量化标准。
  violation_example: 评分办法：企业综合实力（15分）、技术方案（25分）、服务方案（20分）三项共60分由评标委员会根据投标文件综合评定。
  suggestion_template: 压缩主观评分项，将评分重点转向采购需求中的量化指标；采购需求客观、明确的项目，客观但不可量化的指标应作为实质性要求而非评分项，参与评分的指标应当是采购需求中的量化指标。

- code: SCORE_IRRELEVANT
  name: 无关评分项
  category: scoring
  severity: high
  applies_to: [评分办法]
  legal_basis: 《政府采购货物和服务招标投标管理办法》（财政部令第87号）第五十五条；《政府采购需求管理办法》第二十一条
  check_prompt: 检查每个评审因素的设定是否与投标人所提供货物服务的质量相关（包括投标报价、技术或者服务水平、履约能力、售后服务等），是否与相应的商务条件和采购需求对应。对与采购标的质量和合同履行无关的评分项（如企业党建情况、获得非相关领域荣誉、注册地距离等）判定为违规。
  violation_example: 评分办法：投标人获得省级以上"守合同重信用"称号的得3分；投标人注册地在项目所在市的得2分。
  suggestion_template: 删除与采购标的质量和合同履行无关的评分项；每个评审因素均应能对应到采购需求中的具体商务条件或技术指标，并在评分标准中说明其与质量的关联。

- code: SCORE_PRICE_WEIGHT
  name: 价格分权重不合规
  category: scoring
  severity: blocker
  applies_to: [评分办法]
  legal_basis: 《政府采购货物和服务招标投标管理办法》（财政部令第87号）第五十五条
  check_prompt: 检查采用综合评分法的项目，其价格分值占总分值的比重是否符合要求：货物项目不得低于30%，服务项目不得低于10%。计算价格分实际占比并核对项目属性判定是否正确（如将服务项目错判为货物项目以规避30%要求）。说明计算结果。
  violation_example: 本项目为货物采购，评分办法中价格分仅占20分（总分100分）。
  suggestion_template: 按项目属性调整价格分权重，货物项目价格分值占总分值比重不低于30%，服务项目不低于10%；执行国家统一定价标准和采用固定价格采购的项目，其价格不列为评审因素。

- code: SCORE_PRICE_FORMULA
  name: 价格分算法违规
  category: scoring
  severity: high
  applies_to: [评分办法]
  legal_basis: 《政府采购货物和服务招标投标管理办法》（财政部令第87号）第五十五条
  check_prompt: 检查价格分是否采用低价优先法计算，即满足招标文件要求且投标价格最低的投标报价为评标基准价、其价格分为满分，其他投标人的价格分按"（评标基准价／投标报价）×100"计算。核查是否存在去掉最高报价和最低报价后计算平均价作为基准价、以平均价下浮若干百分点作为基准价等违规做法。
  violation_example: 价格分计算：去掉最高和最低报价后取算术平均值作为评标基准价，投标报价等于基准价的得满分，每高1%扣1分。
  suggestion_template: 按低价优先法计算价格分，以满足招标文件要求且投标价格最低的投标报价为评标基准价并给予满分；评标过程中不得去掉报价中的最高报价和最低报价；因落实政府采购政策进行价格调整的，以调整后的价格计算评标基准价和投标报价。

- code: SCORE_QUALIFICATION_AS_FACTOR
  name: 资格条件充作评分项
  category: scoring
  severity: blocker
  applies_to: [评分办法]
  legal_basis: 《政府采购货物和服务招标投标管理办法》（财政部令第87号）第五十五条
  check_prompt: 检查评分办法中是否有将资格条件重复作为评审因素的情形，例如将已被列为资格门槛的资质等级、认证证书、业绩数量再次作为评分项加分。资格条件不得作为评审因素。逐项比对资格条件清单与评审因素清单，指出重复项。
  violation_example: 资格要求为"具有信息系统集成资质"；评分办法中"具有信息系统集成一级资质的加5分，二级资质加3分"。
  suggestion_template: 删除评分办法中与资格条件重复的评审因素；确需区分能力高低的，应在资格条件中一次性设定合理门槛，不得在评审阶段对已通过资格审查的供应商再次以同一条件加分。

- code: SCORE_UNQUANTIFIED_REQUIREMENT
  name: 不可量化指标作评分项
  category: scoring
  severity: high
  applies_to: [评分办法]
  legal_basis: 《政府采购需求管理办法》第二十一条
  check_prompt: 检查采购需求客观、明确的项目，是否存在将采购需求中客观但不可量化的指标作为评分项的情形。此类指标应作为实质性要求而非评分项；参与评分的指标应当是采购需求中的量化指标，且评分项应按量化指标的等次设置对应的不同分值。指出被误用为评分项的不可量化指标。
  violation_example: 评分办法：所投产品"外观设计美观、工艺精良"的得5分，一般的得2分。
  suggestion_template: 将采购需求中客观但不可量化的指标调整为实质性要求（在符合性审查中判断是否满足），评分项仅保留采购需求中的量化指标，并按量化指标的等次设置对应的不同分值。

- code: SCORE_REGION_AWARD
  name: 区域行业奖项加分
  category: scoring
  severity: blocker
  applies_to: [评分办法]
  legal_basis: 《政府采购法实施条例》第二十条第四项
  check_prompt: 检查评分办法中是否以特定行政区域或者特定行业的业绩、奖项作为加分条件。例如对本省、本市颁发的奖项、本行业协会评定的荣誉给予加分。若存在，判定为以不合理条件对供应商实行差别待遇。
  violation_example: 评分办法：投标人近三年获得本市"优秀供应商"称号的，每项加2分，最多加6分。
  suggestion_template: 删除以特定行政区域或特定行业业绩、奖项作为加分条件的条款；确需评价履约能力的，应基于与采购标的直接相关的同类项目履约情况，并明确同类业务的具体范围。

- code: SCORE_UNDISCLOSED
  name: 评标标准未事先载明
  category: scoring
  severity: blocker
  applies_to: [评分办法]
  legal_basis: 《政府采购法实施条例》第三十四条；《政府采购货物和服务招标投标管理办法》（财政部令第87号）第五十五条
  check_prompt: 检查采购文件中是否完整载明了评标方法、评标标准和投标无效情形。招标文件中没有规定的评标标准不得作为评审的依据。核查是否存在"由评标委员会另行确定评分细则""详见评标现场说明"等将评审标准留待评审阶段确定的表述。
  violation_example: 评分办法：具体评分细则由评标委员会在评标现场根据项目情况确定。
  suggestion_template: 在采购文件中完整载明评标方法、评标标准、各评审因素的分值和评分细则以及投标无效情形；评审因素应当在招标文件中规定，不得在评审阶段新增或变更评审标准。

- code: POLICY_SME_RESERVE
  name: 未预留中小企业份额
  category: policy
  severity: high
  applies_to: [全部]
  legal_basis: 《政府采购促进中小企业发展管理办法》（财库〔2020〕46号）
  check_prompt: 检查采购需求是否落实了支持中小企业发展的预留份额要求。对适宜由中小企业提供的采购项目，核查是否采取了项目整体预留、合理预留采购包、要求大企业与中小企业组成联合体、要求大企业向中小企业分包等形式确保中小企业合同份额，并在采购文件中明确。说明未落实的具体表现。
  violation_example: 采购需求及采购文件中未提及中小企业预留份额、价格扣除等任何支持中小企业发展的安排。
  suggestion_template: 按财库〔2020〕46号规定，对适宜由中小企业提供的项目采取项目整体预留或合理预留采购包等方式，明确预留份额比例；未预留份额的项目应明确对小微企业的价格扣除比例，并在采购文件中载明享受政策需提交的证明材料。

- code: POLICY_SME_PRICE_DEDUCT
  name: 未落实价格扣除
  category: policy
  severity: high
  applies_to: [评分办法, 商务要求]
  legal_basis: 《关于进一步加大政府采购支持中小企业力度的通知》（财库〔2022〕19号）
  check_prompt: 检查货物服务采购项目的评审规则中，是否明确了对小微企业的价格扣除优惠，幅度是否达到10%—20%；大中型企业与小微企业组成联合体或者大中型企业向小微企业分包的，评审优惠幅度是否达到4%—6%。若未设置价格扣除或幅度低于规定下限，判定为政策落实不到位。
  violation_example: 评分办法中仅表述"按国家规定给予中小企业价格优惠"，未明确扣除比例。
  suggestion_template: 在评审规则中明确对小微企业报价给予10%—20%的价格扣除（具体比例由采购人根据项目特点确定），联合体或分包情形给予4%—6%的评审优惠，并明确享受优惠需提交的中小企业声明函等材料。

- code: POLICY_SME_ENGINEERING
  name: 工程未面向中小企业
  category: policy
  severity: high
  applies_to: [全部]
  legal_basis: 《关于进一步加大政府采购支持中小企业力度的通知》（财库〔2022〕19号）
  check_prompt: 检查工程采购项目是否落实面向中小企业的预留要求：400万元以下且适宜由中小企业提供的工程采购项目，应当专门面向中小企业采购；超过400万元的工程采购项目中适宜由中小企业提供的，应按规定比例预留份额。若未落实，判定为政策执行不到位。
  violation_example: 本项目为校舍修缮工程，预算金额280万元，采购公告中未设置专门面向中小企业采购的条件。
  suggestion_template: 对400万元以下且适宜由中小企业提供的工程采购项目，在采购公告和采购文件中明确专门面向中小企业采购；超过400万元的，按规定比例预留份额，并在采购文件中载明预留方式。

- code: POLICY_ENERGY_SAVING
  name: 未落实节能产品采购
  category: policy
  severity: medium
  applies_to: [技术参数, 评分办法]
  legal_basis: 《关于调整优化节能产品、环境标志产品政府采购执行机制的通知》（财库〔2019〕9号）；《关于印发节能产品政府采购品目清单的通知》（财库〔2019〕19号）
  check_prompt: 检查采购标的属于节能产品政府采购品目清单范围的，采购需求是否落实了强制采购或优先采购要求，是否明确了依据品目清单和认证证书实施采购的执行方式。若属于清单范围却未作任何政策安排，判定为政策落实缺失。
  violation_example: 本项目采购台式计算机120台，技术要求中未提及节能产品认证要求。
  suggestion_template: 对属于节能产品品目清单范围的采购标的，在采购需求中明确依据品目清单和认证证书实施政府强制采购或优先采购，并要求供应商提供相应认证证书；将节能环保要求作为实质性要求或评审因素予以落实。

- code: POLICY_ENV_LABEL
  name: 未落实环境标志产品
  category: policy
  severity: medium
  applies_to: [技术参数, 评分办法]
  legal_basis: 《关于调整优化节能产品、环境标志产品政府采购执行机制的通知》（财库〔2019〕9号）；《关于印发环境标志产品政府采购品目清单的通知》（财库〔2019〕18号）
  check_prompt: 检查采购标的属于环境标志产品政府采购品目清单范围的，采购需求是否落实了优先采购要求并明确执行方式。若未作安排，判定为政策落实缺失。说明涉及的品目。
  violation_example: 本项目采购办公家具一批，技术要求中未提及环境标志产品认证要求。
  suggestion_template: 对属于环境标志产品品目清单范围的采购标的，明确依据品目清单和认证证书实施政府优先采购，并在评审因素或实质性要求中予以体现。

- code: POLICY_IMPORT_DEMO
  name: 进口产品未论证
  category: policy
  severity: blocker
  applies_to: [技术参数, 全部]
  legal_basis: 《政府采购进口产品管理办法》（财库〔2007〕119号）第四条、第七条、第十二条
  check_prompt: 检查采购需求中是否要求采购进口产品。若要求采购进口产品，核查是否已按规定获得财政部门核准，是否组织了专家组论证且专家组由五人以上单数组成、包含一名法律专家、产品技术专家为非本单位并熟悉该产品的专家、采购人代表未作为专家组成员参与论证。政府采购应当采购本国产品，确需采购进口产品的实行审核管理。
  violation_example: 技术要求中直接列明"进口设备"或国外品牌型号，但采购文件中未见进口产品论证意见和财政部门核准材料。
  suggestion_template: 坚持采购本国产品原则；确需采购进口产品的，应说明国内无法获取或无法以合理商业条件获取的理由，组织符合条件的专家组论证并取得财政部门核准后，方可依法开展采购活动；在采购文件中载明优先采购向我国企业转让技术的供应商的进口产品。

- code: POLICY_DOMESTIC
  name: 未落实采购本国产品
  category: policy
  severity: high
  applies_to: [技术参数]
  legal_basis: 《中华人民共和国政府采购法》第十条
  check_prompt: 检查采购需求是否存在以技术参数、资质要求或原产地要求等方式实质排斥本国产品的情形，例如要求提供境外原产地证明、境外检测报告、以国外标准作为唯一符合性依据。政府采购应当采购本国货物、工程和服务，除法定例外情形外。说明排斥本国产品的具体表现。
  violation_example: 投标产品须提供原产地为欧盟的证明文件，且须通过欧盟CE认证。
  suggestion_template: 删除以原产地、境外认证或国外标准作为唯一符合性依据的条款；确需采购进口产品的，按《政府采购进口产品管理办法》履行论证和核准程序；技术要求应优先引用我国国家标准、行业标准。

- code: POLICY_INNOVATION
  name: 未落实支持创新政策
  category: policy
  severity: medium
  applies_to: [全部]
  legal_basis: 《政府采购需求管理办法》第十四条；第十八条
  check_prompt: 检查采购需求是否通过确定供应商资格条件、设定评审规则等措施落实了支持创新、绿色发展、中小企业发展等政府采购政策功能。特别核查涉及创新产品采购的项目，是否存在对创新产品提出同类业务合同、生产台数、使用时长等业绩要求的情形——此类要求被明确禁止。
  violation_example: 投标产品须具有同类项目应用案例不少于5个，且累计销售台数不低于100台，否则不得参与。
  suggestion_template: 在采购需求中明确落实支持创新、绿色发展、中小企业发展等政策功能的具体措施；涉及政府采购政策支持的创新产品采购的，不得提出同类业务合同、生产台数、使用时长等业绩要求。

- code: BUDGET_MISSING
  name: 预算金额未明确
  category: budget
  severity: high
  applies_to: [需求正文]
  legal_basis: 《政府采购法实施条例》第三十条；《政府采购需求管理办法》第七条
  check_prompt: 检查采购需求文件是否公开了采购项目预算金额，且采购需求是否依据部门预算（工程项目概预算）确定。若未列明预算金额，或预算金额与采购标的、数量明显不匹配，判定为要素缺失或不合规。说明预算金额缺失将导致投标人无法准确响应和评标委员会无法判定报价是否超预算。
  violation_example: 本项目预算金额以财政批复为准，投标人按清单报价即可。
  suggestion_template: 在采购文件中公开采购项目预算金额，设定最高限价的还应公开最高限价；采购需求应依据已批复的部门预算（工程项目概预算）确定，确保预算金额与采购标的、数量相匹配。

- code: BUDGET_OVER_STANDARD
  name: 超标准配置
  category: budget
  severity: high
  applies_to: [技术参数, 需求正文]
  legal_basis: 《政府采购需求管理办法》第七条；《中华人民共和国政府采购法》第七十一条第二项
  check_prompt: 检查采购需求中的技术参数和配置要求是否超出预算标准、资产配置标准等有关规定，是否存在追求高配置、高档次、与教学科研实际需要不符的铺张浪费情形。比对配置标准与需求参数，指出超标准的具体指标。
  violation_example: 采购行政办公用笔记本电脑，要求配置为32GB内存、2TB固态硬盘、独立显卡，单价预算2.5万元。
  suggestion_template: 按预算标准、资产配置标准确定采购需求，遵循厉行节约原则，删除超出实际需要的高配置指标；将配置要求调整至与使用场景和配置标准相符的水平。

- code: BUDGET_SPLIT
  name: 化整为零规避招标
  category: budget
  severity: blocker
  applies_to: [需求正文, 全部]
  legal_basis: 《中华人民共和国政府采购法》第二十八条；《政府采购法实施条例》第二十八条
  check_prompt: 检查是否存在将应当以公开招标方式采购的货物或服务化整为零，或者以其他任何方式规避公开招标的情形。判断方法：核查同一预算项目下同一品目或类别的货物、服务，在一个财政年度内采用公开招标以外方式多次采购的累计资金数额是否超过公开招标数额标准；核查采购包划分是否将同一品目的采购标的拆分为多个小额包。
  violation_example: 将预算320万元的同型号服务器采购拆分为三个批次，每批次金额约105万元，分别采用竞争性磋商方式采购。
  suggestion_template: 按预算项目和品目归集采购需求，同一预算项目下同一品目或类别的货物、服务应合并组织采购；达到公开招标数额标准的应采用公开招标方式，确需采用其他方式的应依法获得批准。

- code: BUDGET_SOURCE
  name: 资金来源不明确
  category: budget
  severity: medium
  applies_to: [需求正文]
  legal_basis: 《政府采购需求管理办法》第七条
  check_prompt: 检查采购需求是否说明了项目资金来源（财政拨款、科研经费、自有资金等）及是否已落实。若资金来源不明或未落实，判定为要素缺失并提示履约付款风险。说明对合同履行的影响。
  violation_example: 资金来源：学校自筹，具体到位时间待定。
  suggestion_template: 明确项目资金来源和预算批复情况，确保采购需求依据已批复的预算确定；对使用科研经费等专项资金的，说明资金到位安排和付款计划。

- code: BUDGET_PRICE_CALC
  name: 未开展价格测算
  category: budget
  severity: medium
  applies_to: [需求正文]
  legal_basis: 《政府采购货物和服务招标投标管理办法》（财政部令第87号）第十条
  check_prompt: 检查采购需求是否体现了对采购标的市场技术或服务水平、供应、价格等情况的市场调查和价格测算结果。若预算金额、最高限价的设定缺乏调查依据，或明显偏离市场水平，判定为前期工作缺失。说明测算依据是否充分。
  violation_example: 最高限价由采购人参照上年度同类项目预算直接确定，未开展市场调查和价格测算。
  suggestion_template: 补充开展市场调查，了解采购标的的市场技术或服务水平、供应和价格情况，结合资产配置标准科学合理确定采购需求和最高限价，并形成书面记录存档。

- code: PROC_METHOD_MISMATCH
  name: 采购方式选择不当
  category: procedure
  severity: high
  applies_to: [全部]
  legal_basis: 《政府采购需求管理办法》第十九条、第二十条；《政府采购非招标采购方式管理办法》（财政部令第74号）第三条
  check_prompt: 检查采购方式的选择是否符合法定适用情形和采购需求特点：采购需求客观、明确且规格标准统一的（如通用设备、物业管理），一般采用招标或者询价方式；技术较复杂或专业性较强的，一般采用招标、谈判（磋商）方式；除法律法规规定可以在有限范围内竞争或者只能从唯一供应商处采购的情形外，一般采用公开方式邀请供应商。说明采购方式与需求特点是否匹配。
  violation_example: 通用办公设备采购项目，需求客观明确、规格标准统一，却采用单一来源方式采购。
  suggestion_template: 根据采购需求特点和法定适用情形重新确定采购方式；需求客观明确、规格标准统一的应采用招标或询价方式并以价格作为授予合同的主要考虑因素；采用非公开方式的应说明法定理由并依法履行批准程序。

- code: PROC_PUBLIC_BID_THRESHOLD
  name: 未依法公开招标
  category: procedure
  severity: blocker
  applies_to: [全部]
  legal_basis: 《中央预算单位政府集中采购目录及标准（2020年版）》（国办发〔2019〕55号）；《政府采购法实施条例》第二十三条
  check_prompt: 检查中央预算单位政府采购货物或服务项目单项采购金额是否达到200万元以上，达到的必须采用公开招标方式。若采用公开招标以外的采购方式，核查是否属于法定特殊情形并已依法获得批准。同时核查分散采购限额标准（货物和服务100万元以上、工程120万元以上）的执行情况。
  violation_example: 本项目货物采购预算金额为260万元，采用竞争性磋商方式采购，采购文件中未见财政部门批准文件。
  suggestion_template: 达到公开招标数额标准的货物或服务项目应采用公开招标方式；因特殊情况需要采用公开招标以外的采购方式的，应在采购活动开始前依法获得批准，并在采购文件中载明批准情况。

- code: PROC_CENTRALIZED_CATALOG
  name: 集采目录内未委托集采
  category: procedure
  severity: high
  applies_to: [全部]
  legal_basis: 《政府采购需求管理办法》第十六条；《中央预算单位政府集中采购目录及标准（2020年版）》（国办发〔2019〕55号）
  check_prompt: 检查采购标的是否属于政府集中采购目录内的品目。属于目录内的，采购人必须委托集中采购机构采购。核查采购需求文件中确定的采购组织形式是否与目录要求一致；同时注意目录表注中"不包括中央高校、科研院所采购的科研仪器设备"的例外情形是否适用。
  violation_example: 本项目采购内容为列入集中采购机构采购项目的通用设备，采购文件中却约定由采购人自行组织采购。
  suggestion_template: 核对采购标的所属品目与集中采购目录，属于目录内的必须委托集中采购机构代理采购；属于部门集中采购项目的按规定报财政部备案后组织实施；确属中央高校科研仪器设备例外情形的，应说明依据。

- code: PROC_INTENTION_30DAYS
  name: 意向公开时限不足
  category: procedure
  severity: medium
  applies_to: [全部]
  legal_basis: 《关于开展政府采购意向公开工作的通知》（财库〔2020〕10号）
  check_prompt: 检查采购项目的意向公开时间是否原则上不晚于采购活动开始前30日，公开内容是否包括采购项目名称、采购需求概况、预算金额、预计采购时间，其中采购需求概况是否包含采购标的名称、主要功能或目标、数量以及质量服务安全时限要求。说明不符合要求的具体项。
  violation_example: 项目于3月1日发布采购公告，采购意向于2月25日才在中国政府采购网公开。
  suggestion_template: 按财库〔2020〕10号要求提前公开采购意向，原则上不得晚于采购活动开始前30日，并确保公开内容包含项目名称、采购需求概况、预算金额和预计采购时间等要素。

- code: PROC_BID_PERIOD
  name: 招标期限不足
  category: procedure
  severity: high
  applies_to: [全部]
  legal_basis: 《中华人民共和国政府采购法》第三十五条；《政府采购法实施条例》第三十一条；《政府采购货物和服务招标投标管理办法》（财政部令第87号）第十六条、第十八条
  check_prompt: 检查招标文件提供期限自开始发出之日起是否不少于5个工作日，自招标文件开始发出之日起至投标人提交投标文件截止之日止是否不少于20日，招标公告、资格预审公告的公告期限是否为5个工作日。核查澄清或修改内容可能影响投标文件编制时，是否在投标截止时间至少15日前书面通知所有潜在投标人。
  violation_example: 招标公告于5月8日发布，投标截止时间为5月20日，招标文件提供期限为3个工作日。
  suggestion_template: 按法定期限安排采购活动时间：招标文件提供期限自开始发出之日起不少于5个工作日，自招标文件开始发出之日起至投标截止之日止不少于20日；澄清或修改可能影响投标文件编制的，应在投标截止时间至少15日前书面通知所有获取招标文件的潜在投标人，不足15日的应顺延投标截止时间。

- code: PROC_NON_BID_PERIOD
  name: 非招标响应期不足
  category: procedure
  severity: medium
  applies_to: [全部]
  legal_basis: 《政府采购非招标采购方式管理办法》（财政部令第74号）第二十九条、第四十五条
  check_prompt: 检查采用竞争性谈判或询价方式采购的项目，从谈判文件、询价通知书发出之日起至供应商提交首次响应文件截止之日止是否不少于3个工作日。核查澄清或修改内容可能影响响应文件编制时，是否在提交首次响应文件截止之日3个工作日前书面通知所有接收文件的供应商。
  violation_example: 询价通知书于6月10日发出，要求供应商6月11日前提交响应文件。
  suggestion_template: 将响应文件提交期限调整为自谈判文件、询价通知书发出之日起不少于3个工作日；澄清或修改可能影响响应文件编制的，应在提交首次响应文件截止之日3个工作日前书面通知所有接收文件的供应商，不足3个工作日的顺延截止时间。

- code: PROC_SINGLE_SOURCE
  name: 单一来源未公示论证
  category: procedure
  severity: blocker
  applies_to: [全部]
  legal_basis: 《政府采购非招标采购方式管理办法》（财政部令第74号）第三十八条；《政府采购法实施条例》第三十八条
  check_prompt: 检查拟采用单一来源方式采购的项目：属于《政府采购法》第三十一条第一项情形且达到公开招标数额的货物、服务项目，是否在省级以上财政部门指定媒体上公示且公示期不少于5个工作日；公示内容是否包括采购人及项目名称内容、拟采购货物或服务的说明、采用单一来源方式的原因及相关说明、拟定的唯一供应商名称和地址、专业人员对相关供应商因专利或专有技术等原因具有唯一性的具体论证意见以及专业人员的姓名工作单位和职称等。
  violation_example: 采购文件以"只能从唯一供应商处采购"为由采用单一来源方式，但未见公示材料，也未提供专业人员关于唯一性的论证意见。
  suggestion_template: 在报财政部门批准前，于省级以上财政部门指定媒体公示不少于5个工作日，公示内容应完整包括法定事项；组织专业人员对唯一性出具具体论证意见并公开其姓名、工作单位和职称；收到异议的应在公示期满后5个工作日内组织补充论证。

- code: PROC_DEMAND_SURVEY
  name: 应开展需求调查未开展
  category: procedure
  severity: high
  applies_to: [全部]
  legal_basis: 《政府采购需求管理办法》第十条、第十一条
  check_prompt: 检查项目是否属于应当开展需求调查的情形：1000万元以上的货物、服务采购项目，3000万元以上的工程采购项目；涉及公共利益、社会关注度较高的采购项目；技术复杂、专业性较强的项目（包括需定制开发的信息化建设项目、采购进口产品的项目）；主管预算单位或者采购人认为需要开展需求调查的其他采购项目。属于上述范围而未开展需求调查的，判定为程序缺失。
  violation_example: 本项目为预算1500万元的信息系统定制开发项目，采购文件中未附需求调查记录，未开展面向市场主体的需求调查。
  suggestion_template: 按《政府采购需求管理办法》第十一条开展需求调查，面向市场主体开展调查时选择的调查对象一般不少于3个并具有代表性，调查内容包括相关产业发展、市场供给、同类采购项目历史成交信息以及可能涉及的运行维护、升级更新、备品备件、耗材等后续采购情况，并形成书面记录存档。

- code: PROC_KEY_REVIEW
  name: 应重点审查未审查
  category: procedure
  severity: high
  applies_to: [全部]
  legal_basis: 《政府采购需求管理办法》第二十九条、第三十一条、第三十三条
  check_prompt: 检查属于《政府采购需求管理办法》第十一条规定范围（1000万元以上货物服务、3000万元以上工程、涉及公共利益、技术复杂或采购进口产品等）的采购项目，是否在采购活动开始前开展了重点审查。重点审查应包含非歧视性审查、竞争性审查、采购政策审查、履约风险审查。核查是否有审查记录及审查结论。
  violation_example: 本项目采购进口科研仪器设备，预算1200万元，采购文件中未附采购需求和采购实施计划的审查记录。
  suggestion_template: 在采购活动开始前组织重点审查，审查内容包括非歧视性审查（是否指向特定供应商或特定产品、资格条件是否合理、业绩要求是否超过2个同类业务合同、技术要求是否指向特定专利商标品牌技术路线、评审因素是否具有倾向性）、竞争性审查、采购政策审查和履约风险审查，审查不通过的应修改后重新审查，并形成书面记录存档。

- code: PROC_PLAN_COMPLETE
  name: 采购实施计划不完整
  category: procedure
  severity: medium
  applies_to: [全部]
  legal_basis: 《政府采购需求管理办法》第十三条、第三十条
  check_prompt: 检查采购实施计划是否完整，是否包括合同订立安排（采购项目预概算、最高限价、开展采购活动的时间安排、采购组织形式和委托代理安排、采购包划分与合同分包、供应商资格条件、采购方式、竞争范围和评审规则）和合同管理安排（合同类型、定价方式、合同文本主要条款、履约验收方案、风险管控措施）。核查对采购方式、评审规则、合同类型、定价方式的选择是否说明了适用理由。
  violation_example: 采购实施计划中仅列明了预算金额和采购方式，未包含采购包划分、定价方式、履约验收方案和风险管控措施。
  suggestion_template: 按《政府采购需求管理办法》第十三条补全采购实施计划的合同订立安排和合同管理安排两部分内容，并对采购方式、评审规则、合同类型、定价方式的选择逐项说明适用理由。

- code: PROC_CONTRACT_TERMS
  name: 合同条款不完整
  category: procedure
  severity: medium
  applies_to: [商务要求]
  legal_basis: 《政府采购需求管理办法》第二十三条
  check_prompt: 检查拟签订的合同文本是否包含法定必备条款和采购需求的所有内容，包括标的名称、采购标的质量和数量规模、履行时间期限地点和方式、包装方式、价款或者报酬、付款进度安排、资金支付方式、验收交付标准和方法、质量保修范围和保修期、违约责任与解决争议的方法等。核查涉及知识产权归属的项目是否约定了知识产权的归属和处理方式。
  violation_example: 合同文本仅有标的、金额和交货期三项内容，未约定验收标准、质量保修范围、违约责任和争议解决方法。
  suggestion_template: 按《政府采购需求管理办法》第二十三条补全合同必备条款；涉及知识产权归属、处理的（如订购、设计、定制开发的信息化建设项目）应约定知识产权的归属和处理方式；属于该办法第十一条规定范围的项目，合同文本应当经过采购人聘请的法律顾问审定。
