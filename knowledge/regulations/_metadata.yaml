# regulations.yaml
# 中直高校（中央部门直属高校）政府采购需求审查 —— 法规知识库种子数据
# 核实状态：source_url 指向已实际抓取并核对过正文/元数据的官方页面。
# 未能核实到官方原文的条目，doc_number 或 effective_date 留空，并在末尾「准确性说明」中标注。

- title: 中华人民共和国政府采购法
  doc_number: ""
  issuing_body: 全国人民代表大会常务委员会
  effective_date: 2003-01-01
  category: law
  level: national
  source_url: https://www.ccgp.gov.cn/zcfg/gjfg/201310/t20131029_3587339.htm
  summary: 政府采购基本法律；第五条禁止限制供应商自由进入本地区和本行业市场，第十条确立采购本国货物工程服务原则，第二十二条、第二十八条、第三十五条、第四十一条分别规定供应商条件、禁止化整为零规避公开招标、招标二十日等标期和履约验收，是需求审查的最高位阶依据。

- title: 中华人民共和国政府采购法实施条例
  doc_number: 国务院令第658号
  issuing_body: 国务院
  effective_date: 2015-03-01
  category: regulation
  level: national
  source_url: https://www.ccgp.gov.cn/zcfg/mof/201502/t20150227_5029424.htm
  summary: 第二十条逐项列举八种「以不合理条件对供应商实行差别待遇或者歧视待遇」情形，是资格条件、技术参数、评分办法合法性审查的核心条款；第三十条、第三十三条、第三十四条、第四十五条、第四十八条分别规定预算公开、投标保证金上限2%、评标方法与量化对应、履约验收、履约保证金上限10%。

- title: 政府采购需求管理办法
  doc_number: 财库〔2021〕22号
  issuing_body: 财政部
  effective_date: 2021-07-01
  category: rule
  level: ministry
  source_url: https://www.gov.cn/gongbao/content/2021/content_5623061.htm
  summary: 需求审查的主干规章；第六条界定技术/商务要求范围，第九条要求量化指标明确等次，第十一条规定应开展需求调查的四类项目，第十八条限制业绩作为资格条件不超过2个同类合同，第二十一条规范评审因素设定，第二十三至二十四条规定合同文本与履约验收方案，第二十九至三十三条建立一般性审查与重点审查（非歧视性、竞争性、采购政策、履约风险）机制。

- title: 政府采购货物和服务招标投标管理办法
  doc_number: 财政部令第87号
  issuing_body: 财政部
  effective_date: 2017-10-01
  category: rule
  level: ministry
  source_url: https://www.ccgp.gov.cn/zcfg/mofgz/201707/t20170718_8541199.htm
  summary: 第十一条明确采购需求七项必备内容，第十二条禁止设定最低限价，第十七条禁止将注册资本等规模条件和生产厂家授权作为资格要求或评审因素，第二十条要求以醒目方式标明实质性要求，第三十一条规定核心产品，第五十五条要求价格分货物不低于30%、服务不低于10%并采用低价优先法，资格条件不得作为评审因素。

- title: 政府采购非招标采购方式管理办法
  doc_number: 财政部令第74号
  issuing_body: 财政部
  effective_date: 2014-02-01
  category: rule
  level: ministry
  source_url: https://www.ccgp.gov.cn/zcfg/mofgz/201401/t20140103_4650784.htm
  summary: 第十条明确规定谈判文件、询价通知书不得要求或者标明供应商名称或者特定货物的品牌，不得含有指向特定供应商的技术、服务等条件；第十一条列明文件必备内容，第十四条限定保证金不超过预算2%，第二十九条、第四十五条分别规定不少于3个工作日的响应期。

- title: 政府采购框架协议采购方式管理暂行办法
  doc_number: 财政部令第110号
  issuing_body: 财政部
  effective_date: 2022-03-01
  category: rule
  level: ministry
  source_url: https://www.ccgp.gov.cn/zcfg/mofgz/202201/t20220127_17561525.htm
  summary: 规范多频次、小额度采购；第十一至十二条要求开展需求调查（调查对象一般各不少于3个）并列明货物与服务项目应明确的采购需求要素，第十三条要求确定最高限制单价，第二十五至二十七条规定价格优先法/质量优先法与淘汰比例，适用于高校办公耗材、通用设备等小额零星采购的需求审查。

- title: 政府采购促进中小企业发展管理办法
  doc_number: 财库〔2020〕46号
  issuing_body: 财政部、工业和信息化部
  effective_date: ""
  category: rule
  level: ministry
  source_url: https://www.gov.cn/zhengce/zhengceku/2020-12/29/content_5574611.htm
  summary: 中小企业预留份额与价格评审优惠的基础性文件；规定适宜由中小企业提供的项目应预留份额专门面向中小企业采购，未预留份额项目对小微企业报价给予价格扣除（货物服务6%—10%），并对联合体和分包设定评审优惠。具体施行日期以附件办法原文为准，待人工复核。

- title: 关于进一步加大政府采购支持中小企业力度的通知
  doc_number: 财库〔2022〕19号
  issuing_body: 财政部
  effective_date: 2022-07-01
  category: notice
  level: ministry
  source_url: https://www.ccgp.gov.cn/zcfg/mof/202205/t20220531_17999872.htm
  summary: 将货物服务项目小微企业价格扣除优惠由6%—10%提高至10%—20%，联合体或分包优惠由2%—3%提高至4%—6%；明确400万元以下工程采购项目适宜由中小企业提供的应当专门面向中小企业采购，超过400万元的工程项目预留份额阶段性提高至40%以上；要求不得收取没有法律法规依据的保证金。

- title: 政府采购进口产品管理办法
  doc_number: 财库〔2007〕119号
  issuing_body: 财政部
  effective_date: 2007-12-27
  category: rule
  level: ministry
  source_url: https://www.mofcom.gov.cn/zcfb/zgdwjjmywg/art/2008/art_c602b2e78bf74e9cafdb0805fb9f2e50.html
  summary: 确立「采购本国产品为原则、确需采购进口产品实行审核管理」制度；第七条要求获得财政部门核准后方可采购，第十二条要求专家组五人以上单数且必须包括一名法律专家、采购人代表不得作为专家组成员，第十四条规定进口产品应以公开招标为主要方式。高校科研仪器设备采购需求审查的关键依据。

- title: 必须招标的工程项目规定
  doc_number: 国家发展和改革委员会令第16号
  issuing_body: 国家发展和改革委员会
  effective_date: ""
  category: rule
  level: ministry
  source_url: https://www.ccgp.gov.cn/zcfg/bwfile/201806/t20180612_10082983.htm
  summary: 界定必须招标的工程建设项目范围与规模标准，是判断高校基建、修缮工程应否招标以及采购方式选择的依据。文号与施行日期未能从官方原文页面直接核实，待人工复核（发改法规规〔2018〕843号正文确认其名称存在）。

- title: 必须招标的基础设施和公用事业项目范围规定
  doc_number: 发改法规规〔2018〕843号
  issuing_body: 国家发展和改革委员会
  effective_date: 2018-06-06
  category: rule
  level: ministry
  source_url: https://www.ccgp.gov.cn/zcfg/bwfile/201806/t20180612_10082983.htm
  summary: 明确不属于《必须招标的工程项目规定》第二条、第三条情形但关系社会公共利益、公众安全的大型基础设施和公用事业项目必须招标的具体范围，用于校舍、能源、通信、水利等校园基建项目的招标判定。

- title: 中央预算单位政府集中采购目录及标准（2020年版）
  doc_number: 国办发〔2019〕55号
  issuing_body: 国务院办公厅
  effective_date: 2020-01-01
  category: standard
  level: national
  source_url: https://www.ccgp.gov.cn/zcfg/gwywj/202001/t20200110_13735497.htm
  summary: 中央预算单位（含中央高校）采购组织形式与限额的直接依据；分散采购限额标准为货物和服务单项或批量100万元以上、工程120万元以上，货物服务公开招标数额标准为单项200万元以上；目录表注明确所列项目不包括中央高校、科研院所采购的科研仪器设备，该例外对高校需求审查至关重要。

- title: 关于开展政府采购意向公开工作的通知
  doc_number: 财库〔2020〕10号
  issuing_body: 财政部
  effective_date: 2020-03-02
  category: notice
